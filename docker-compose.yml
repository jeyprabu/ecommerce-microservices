version: '3.9'
services:


  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data


  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: customer_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql


  mongodb:
    image: mongo:4.4
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db


  api-gateway:
    image: maven:3.9.6-eclipse-temurin-17
    container_name: api-gateway
    working_dir: /app
    volumes:
      - ./:/app
      - ~/.m2:/root/.m2
    command: mvn -pl api-gateway spring-boot:run
    depends_on:
      - customer-service
      - order-service
    ports:
      - "8080:8080"


  customer-service:
    image: maven:3.9.6-eclipse-temurin-17
    container_name: customer-service
    working_dir: /app
    volumes:
      - ./:/app
      - ~/.m2:/root/.m2
    command: sh -c "mvn install -pl common-library && mvn -pl customer-service spring-boot:run"
    depends_on:
      - mysql
    ports:
      - "8081:8081"


  order-service:
    image: maven:3.9.6-eclipse-temurin-17
    container_name: order-service
    working_dir: /app
    volumes:
      - ./:/app
      - ~/.m2:/root/.m2
    command: sh -c "mvn install -pl common-library && mvn -pl order-service spring-boot:run"
    depends_on:
      - mongodb
      - kafka
    ports:
      - "8082:8082"


  inventory-service:
    image: maven:3.9.6-eclipse-temurin-17
    container_name: inventory-service
    working_dir: /app
    volumes:
      - ./:/app
      - ~/.m2:/root/.m2
    command: sh -c "mvn install -pl common-library && mvn -pl inventory-service spring-boot:run"
    depends_on:
      - kafka
    ports:
      - "8083:8083"
    

  auth-service:
    image: maven:3.9.6-eclipse-temurin-17
    container_name: auth-service
    working_dir: /app
    volumes:
      - ./:/app
      - ~/.m2:/root/.m2
    command: sh -c "mvn install -pl common-library && mvn -pl auth-service spring-boot:run"
    depends_on:
      - mysql
    ports:
      - "8084:8084"


volumes:
  mysql_data:
  mongodb_data:
  kafka_data:
  maven-repo: